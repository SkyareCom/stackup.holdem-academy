name: Apply simulator filters v89

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-simulator-filters-v89.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Apply simulator filters
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('practice-advanced.js')
          s=p.read_text()

          old="  const shuffleOptions=item=>seeded(item.options,item.id?hash(item.id):1);\n"
          new="""  const shuffleOptions=item=>seeded(item.options,item.id?hash(item.id):1);\n\n  const SIM_FILTERS=[\n    {key:'HNL',label:'HNL',match:s=>norm(s.game).includes('TEXAS HOLD')},\n    {key:'PLO4',label:'PLO4',match:s=>norm(s.game)==='PLO4'},\n    {key:'PLO5',label:'PLO5',match:s=>norm(s.game)==='PLO5'},\n    {key:'PLO6',label:'PLO6',match:s=>norm(s.game)==='PLO6'},\n    {key:'MAIS',label:'MAIS',match:s=>!['TEXAS HOLD\\'EM','PLO4','PLO5','PLO6'].includes(norm(s.game))}\n  ];\n  if(!SIM_FILTERS.some(f=>f.key===state.sim.filter))state.sim.filter='HNL';\n  const activeSimFilter=()=>SIM_FILTERS.find(f=>f.key===state.sim.filter)||SIM_FILTERS[0];\n  const simBank=()=>B.sim.filter(activeSimFilter().match);\n  const simFilterBar=()=>`<div class=\"p3x-sim-filters\" role=\"group\" aria-label=\"Filtrar modalidade do simulador\">${SIM_FILTERS.map(f=>`<button type=\"button\" class=\"p3x-filter-btn ${f.key===state.sim.filter?'active':''}\" data-sim-filter=\"${f.key}\">${f.label}</button>`).join('')}</div>`;\n"""
          assert old in s, 'shuffleOptions marker not found'
          s=s.replace(old,new,1)

          old="    .p3x-kicker{font-size:12px;letter-spacing:.07em;text-transform:uppercase;color:#a87c32;margin-bottom:7px}\n"
          new=old+"    .p3x-sim-filters{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px;margin:0 0 10px}.p3x-filter-btn{min-width:0;padding:9px 3px;border:1px solid #a87c3270;border-radius:10px;background:#e7dcc2;color:#5f4b39;font:inherit;font-size:12px;line-height:1;text-align:center;cursor:pointer}.p3x-filter-btn.active{background:#08372d;color:#d4aa58;border-color:#d4aa58;box-shadow:0 4px 12px #0003}.p3x-filter-btn:focus-visible{outline:2px solid #d4aa58;outline-offset:2px}\n"
          assert old in s, 'kicker css marker not found'
          s=s.replace(old,new,1)

          old="  function counter(mode,total){\n    const r=state[mode].results||{};\n    const done=Object.keys(r).length,correct=Object.values(r).filter(Boolean).length;\n    return `<div class=\"fi-stats p3x-counter\" data-unified-progress=\"1\"><div class=\"fi-stat\"><span class=\"fi-stat-label\">CERTOS</span><strong class=\"fi-stat-value\">${correct} · ${pct(correct,done)}%</strong></div><div class=\"fi-stat\"><span class=\"fi-stat-label\">REALIZADOS</span><strong class=\"fi-stat-value\">${done} · ${pct(done,total)}%</strong></div><div class=\"fi-stat\"><span class=\"fi-stat-label\">TOTAL</span><strong class=\"fi-stat-value\">${total} · 100%</strong></div></div>`;\n  }\n"
          new="""  function counter(mode,total,bank=null){\n    const r=state[mode].results||{};\n    const ids=bank?new Set(bank.map(x=>x.id)):null;\n    const entries=Object.entries(r).filter(([id])=>!ids||ids.has(id));\n    const done=entries.length,correct=entries.filter(([,ok])=>ok).length;\n    return `<div class=\"fi-stats p3x-counter\" data-unified-progress=\"1\"><div class=\"fi-stat\"><span class=\"fi-stat-label\">CERTOS</span><strong class=\"fi-stat-value\">${correct} · ${pct(correct,done)}%</strong></div><div class=\"fi-stat\"><span class=\"fi-stat-label\">REALIZADOS</span><strong class=\"fi-stat-value\">${done} · ${pct(done,total)}%</strong></div><div class=\"fi-stat\"><span class=\"fi-stat-label\">TOTAL</span><strong class=\"fi-stat-value\">${total} · 100%</strong></div></div>`;\n  }\n"""
          assert old in s, 'counter block not found'
          s=s.replace(old,new,1)

          old="""    if(mode==='sim'){\n      if(!current.sim)current.sim=pick('sim',B.sim);\n      const s=current.sim;\n      shell.innerHTML=`${counter('sim',B.sim.length)}<div class=\"p3x-kicker\">${esc(s.game)} · SPOT ${esc(s.id)} · MÃO SIMULADA</div>${liveTable(s)}<div class=\"p3x-panel\"><h3>SUA DECISÃO</h3>${optionBlock(s)}<div class=\"p3x-nav\"><button class=\"p3x-btn\" data-prev>ANTERIOR</button><button class=\"p3x-btn\" data-redo>REFAZER MÃO</button><button class=\"p3x-btn\" data-next>PRÓXIMA MÃO</button></div></div>`;\n      bindExercise(shell,'sim',B.sim,B.sim.length,s);requestAnimationFrame(()=>animateHand(shell,s));\n"""
          new="""    if(mode==='sim'){\n      const bank=simBank();\n      if(!current.sim||!bank.some(x=>x.id===current.sim.id))current.sim=pick('sim',bank);\n      const s=current.sim;\n      shell.innerHTML=`${simFilterBar()}${counter('sim',bank.length,bank)}<div class=\"p3x-kicker\">${esc(activeSimFilter().label)} · ${esc(s.game)} · SPOT ${esc(s.id)} · MÃO SIMULADA</div>${liveTable(s)}<div class=\"p3x-panel\"><h3>SUA DECISÃO</h3>${optionBlock(s)}<div class=\"p3x-nav\"><button class=\"p3x-btn\" data-prev>ANTERIOR</button><button class=\"p3x-btn\" data-redo>REFAZER MÃO</button><button class=\"p3x-btn\" data-next>PRÓXIMA MÃO</button></div></div>`;\n      shell.querySelectorAll('[data-sim-filter]').forEach(btn=>btn.addEventListener('click',()=>{\n        const key=btn.dataset.simFilter;if(key===state.sim.filter)return;\n        state.sim.filter=key;save();current.sim=null;history.sim=[];answered.sim=false;renderMode('sim');\n      }));\n      bindExercise(shell,'sim',bank,bank.length,s);requestAnimationFrame(()=>animateHand(shell,s));\n"""
          assert old in s, 'sim render block not found'
          s=s.replace(old,new,1)

          old="if(mode==='sim')blocks.innerHTML=`<div class=\"block\"><h3>SIMULAÇÃO DE JOGO</h3><p>A mão acontece visualmente na mesa: dealer, blinds, distribuição, stacks, apostas, pote, valor a pagar, board e showdown. A pergunta aparece como decisão dentro da situação.</p></div><div class=\"block\"><h3>250 SPOTS</h3><p><strong>175 Texas Hold’em</strong>, <strong>50 Omaha PLO4/PLO5/PLO6</strong> e <strong>25 das demais modalidades</strong>.</p></div><div class=\"block\"><h3>NÍVEL</h3><p>Situações conceituais e reais de nível inicial para o jogador se ambientar com a sequência de uma mão.</p></div>`;"
          new="if(mode==='sim')blocks.innerHTML=`<div class=\"block\"><h3>SIMULAÇÃO DE JOGO</h3><p>A mão acontece visualmente na mesa: dealer, blinds, distribuição, stacks, apostas, pote, valor a pagar, board e showdown. A pergunta aparece como decisão dentro da situação.</p></div><div class=\"block\"><h3>FILTROS PRIORITÁRIOS</h3><p><strong>HNL, PLO4, PLO5 e PLO6</strong> ficam separados para treino direcionado. <strong>MAIS</strong> reúne as demais modalidades.</p></div><div class=\"block\"><h3>ESTATÍSTICAS POR FILTRO</h3><p>CERTOS, REALIZADOS e TOTAL mostram somente os spots da modalidade selecionada, preservando o progresso de cada grupo.</p></div>`;"
          assert old in s, 'sim theory block not found'
          s=s.replace(old,new,1)

          p.write_text(s)
          PY

      - name: Validate JavaScript
        run: node --check practice-advanced.js

      - name: Validate filters
        run: |
          grep -q "data-sim-filter" practice-advanced.js
          grep -q "const simBank" practice-advanced.js
          grep -q "counter('sim',bank.length,bank)" practice-advanced.js

      - name: Commit simulator filters
        run: |
          git config user.name "SkyareCom"
          git config user.email "skyare.company@gmail.com"
          git add practice-advanced.js
          git commit -m "Adiciona filtros por modalidade no simulador"
          git push origin main
