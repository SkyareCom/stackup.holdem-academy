name: Fix simulator i18n v90

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-i18n-simulator-v90.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Add simulator translations
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('i18n-en-us-words-extra-4.js')
          s=p.read_text()
          assert s.rstrip().endswith('});'), 'dictionary ending not found'
          base=s.rstrip()[:-3]
          additions=',"ação":"action","acao":"action","entrando":"entering","distribuindo":"dealing","prioritários":"priority","prioritarios":"priority"});\n'
          p.write_text(base+additions)
          PY

      - name: Validate translation audit
        run: node test-i18n.js

      - name: Commit translations
        run: |
          git config user.name "SkyareCom"
          git config user.email "skyare.company@gmail.com"
          git add i18n-en-us-words-extra-4.js
          git commit -m "Completa traducao dos filtros e estados do simulador"
          git push origin main
