name: Build Android Packages

on:
  push:
    branches:
      - main
    paths:
      - 'android/**'
      - '.github/workflows/android-build.yml'
      - 'scripts/security-guard.js'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    if: github.actor == 'SkyareCom'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment:
      name: android-signing
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Security repository guard
        run: node scripts/security-guard.js

      - name: Set up Java 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: platform-tools

      - name: Install Android 36 SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 9.6
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          gradle-version: '9.6.0'

      - name: Prepare optional Play upload signing
        env:
          ANDROID_UPLOAD_KEYSTORE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
          ANDROID_UPLOAD_STORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_STORE_PASSWORD }}
          ANDROID_UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          ANDROID_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
        run: |
          if [ -n "$ANDROID_UPLOAD_KEYSTORE_BASE64" ] && \
             [ -n "$ANDROID_UPLOAD_STORE_PASSWORD" ] && \
             [ -n "$ANDROID_UPLOAD_KEY_ALIAS" ] && \
             [ -n "$ANDROID_UPLOAD_KEY_PASSWORD" ]; then
            printf '%s' "$ANDROID_UPLOAD_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/stackup-upload.jks"
            chmod 600 "$RUNNER_TEMP/stackup-upload.jks"
            echo "STACKUP_SIGNING_READY=true" >> "$GITHUB_ENV"
          else
            echo "STACKUP_SIGNING_READY=false" >> "$GITHUB_ENV"
          fi

      - name: Run Android release lint
        run: gradle -p android :app:lintRelease --stacktrace

      - name: Build release AAB and production APK
        env:
          STACKUP_UPLOAD_KEYSTORE: ${{ runner.temp }}/stackup-upload.jks
          STACKUP_UPLOAD_STORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_STORE_PASSWORD }}
          STACKUP_UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          STACKUP_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
        run: gradle -p android :app:bundleRelease :app:assembleRelease --stacktrace

      - name: Verify AAB integrity
        run: |
          AAB="android/app/build/outputs/bundle/release/app-release.aab"
          test -s "$AAB"
          unzip -t "$AAB"
          sha256sum "$AAB" | tee "${AAB}.sha256"

      - name: Verify signed Play AAB
        if: ${{ env.STACKUP_SIGNING_READY == 'true' }}
        run: |
          AAB="android/app/build/outputs/bundle/release/app-release.aab"
          jarsigner -verify -verbose -certs "$AAB"

      - name: Record release signing status
        run: |
          mkdir -p android/app/build/outputs/bundle/release
          {
            echo "package=com.skyare.stackupacademy"
            echo "versionName=1.0.3"
            echo "versionCode=4"
            echo "targetSdk=36"
            echo "shell=webview"
            echo "contentUrl=https://skyarecom.github.io/stackup.holdem-academy/"
            echo "signed=${STACKUP_SIGNING_READY}"
          } > android/app/build/outputs/bundle/release/RELEASE-INFO.txt

      - name: Verify production APK uses native WebView launcher
        if: ${{ env.STACKUP_SIGNING_READY == 'true' }}
        run: |
          APK="android/app/build/outputs/apk/release/app-release.apk"
          AAPT="$ANDROID_HOME/build-tools/36.0.0/aapt"
          test -s "$APK"
          "$AAPT" dump badging "$APK" | tee /tmp/stackup-release-badging.txt
          grep -q "package: name='com.skyare.stackupacademy'" /tmp/stackup-release-badging.txt
          grep -q "launchable-activity: name='com.skyare.stackupacademy.MainActivity'" /tmp/stackup-release-badging.txt
          "$AAPT" dump xmltree "$APK" AndroidManifest.xml | tee /tmp/stackup-release-manifest.txt
          ! grep -q "com.google.androidbrowserhelper.trusted" /tmp/stackup-release-manifest.txt
          ! grep -q "android.support.customtabs.trusted" /tmp/stackup-release-manifest.txt
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$APK"

      - name: Build installable debug APK
        run: gradle -p android :app:assembleDebug --stacktrace

      - name: Verify debug APK uses the same native launcher
        run: |
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          AAPT="$ANDROID_HOME/build-tools/36.0.0/aapt"
          "$AAPT" dump badging "$APK" | tee /tmp/stackup-debug-badging.txt
          grep -q "package: name='com.skyare.stackupacademy.test'" /tmp/stackup-debug-badging.txt
          grep -q "launchable-activity: name='com.skyare.stackupacademy.MainActivity'" /tmp/stackup-debug-badging.txt
          "$AAPT" dump xmltree "$APK" AndroidManifest.xml | tee /tmp/stackup-debug-manifest.txt
          ! grep -q "com.google.androidbrowserhelper.trusted" /tmp/stackup-debug-manifest.txt
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$APK"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Smoke test APK on Android emulator
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          script: |
            test -s android/app/build/outputs/apk/release/app-release.apk
            adb install -r android/app/build/outputs/apk/release/app-release.apk
            adb shell pm list packages | grep -q "^package:com.skyare.stackupacademy$"
            adb logcat -c
            adb shell am force-stop com.skyare.stackupacademy
            adb shell am start -W -n com.skyare.stackupacademy/com.skyare.stackupacademy.MainActivity > /tmp/stackup-start.txt
            cat /tmp/stackup-start.txt
            grep -q "Status: ok" /tmp/stackup-start.txt
            grep -q "MainActivity" /tmp/stackup-start.txt
            sleep 8
            adb logcat -d -v brief > /tmp/stackup-logcat.txt
            ! grep -q "FATAL EXCEPTION.*com.skyare.stackupacademy" /tmp/stackup-logcat.txt

      - name: Upload Play AAB artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: stackup-academy-play-aab
          path: |
            android/app/build/outputs/bundle/release/*.aab
            android/app/build/outputs/bundle/release/*.sha256
            android/app/build/outputs/bundle/release/RELEASE-INFO.txt
          if-no-files-found: error

      - name: Upload installable test APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: stackup-academy-android-test-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
