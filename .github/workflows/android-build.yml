name: Build Android Packages

on:
  push:
    branches:
      - main
    paths:
      - 'android/**'
      - '.github/workflows/android-build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 36 SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Build release AAB
        run: gradle -p android :app:bundleRelease --stacktrace

      - name: Build installable debug APK
        run: gradle -p android :app:assembleDebug --stacktrace

      - name: Verify installable APK launcher
        run: |
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" | tee /tmp/stackup-apk-badging.txt
          grep -q "launchable-activity: name='com.skyare.stackupacademy.MainActivity'" /tmp/stackup-apk-badging.txt
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$APK"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Smoke test APK on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          script: |
            adb install -r android/app/build/outputs/apk/debug/app-debug.apk
            adb logcat -c
            adb shell am force-stop com.skyare.stackupacademy
            adb shell am start -W -n com.skyare.stackupacademy/.MainActivity > /tmp/stackup-start.txt
            cat /tmp/stackup-start.txt
            grep -q "Status: ok" /tmp/stackup-start.txt
            sleep 8
            adb logcat -d -v brief > /tmp/stackup-logcat.txt
            cat /tmp/stackup-logcat.txt
            ! grep -q "FATAL EXCEPTION" /tmp/stackup-logcat.txt
            adb shell dumpsys package com.skyare.stackupacademy | grep -q "com.skyare.stackupacademy.MainActivity"

      - name: Upload unsigned AAB
        uses: actions/upload-artifact@v4
        with:
          name: stackup-academy-android-aab
          path: android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error

      - name: Upload installable test APK
        uses: actions/upload-artifact@v4
        with:
          name: stackup-academy-android-test-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
