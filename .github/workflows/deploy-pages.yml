name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    if: github.actor == 'SkyareCom'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      - name: Security repository guard
        run: node scripts/security-guard.js

      - name: Validate JavaScript syntax
        run: |
          find . -maxdepth 1 -type f -name '*.js' -print0 | sort -z | xargs -0 -n1 node --check
          node --check scripts/security-guard.js

      - name: Run poker engine tests
        run: node test-engine.js

      - name: Audit quiz options
        run: node test-quiz-quality.js

      - name: Audit English translation
        run: node test-i18n.js

      - name: Protect Academy performance
        run: node test-performance.js

      - name: Protect navigation scroll ownership
        run: node test-navigation.js

      - name: Test first mobile swipe and PWA navigation
        timeout-minutes: 8
        run: |
          npm install --prefix "$RUNNER_TEMP/academy-browser" playwright
          "$RUNNER_TEMP/academy-browser/node_modules/.bin/playwright" install --with-deps chromium
          NODE_PATH="$RUNNER_TEMP/academy-browser/node_modules" node test-mobile-scroll.js

      - name: Protect Academy typography
        run: node test-typography.js

      - name: Validate Play release UI
        run: node test-ui-release.js

      - name: Validate web manifest
        run: node -e "JSON.parse(require('fs').readFileSync('manifest.webmanifest','utf8')); console.log('manifest.webmanifest OK')"

      - name: Setup Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
