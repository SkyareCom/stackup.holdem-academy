<!doctype html>

<style>
@import url('https://fonts.googleapis.com/css2?family=Love+Ya+Like+A+Sister&display=swap');
:root{--green:#0e4b3b;--green2:#08372d;--green3:#195f4c;--brown:#211008;--brown2:#2a160d;--cream:#f2ead8;--cream2:#e8dcc2;--ink:#25170f;--muted:#725f4d;--gold:#d4aa58;--gold2:#a87c32;--white:#f8f0df;--shadow:0 14px 34px rgba(0,0,0,.24);font-family:'Love Ya Like A Sister',cursive}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;min-height:100%;background:var(--brown);color:var(--white)}body{overscroll-behavior-y:none}button{font:inherit}.app{min-height:100dvh;max-width:560px;margin:auto;background:var(--brown)}.brand{cursor:pointer;background:linear-gradient(180deg,var(--green3),var(--green) 58%,var(--green2));border-bottom:4px solid var(--gold);padding:calc(18px + env(safe-area-inset-top)) 22px 17px;box-shadow:0 8px 24px rgba(0,0,0,.22)}.brandin{display:flex;align-items:center;gap:15px;max-width:480px;margin:auto}.logo{width:56px;height:56px;flex:none}.name{font-size:25px;line-height:1.02;letter-spacing:.045em;text-transform:uppercase}.sub{margin-top:5px;font-size:15px;letter-spacing:.12em;color:var(--gold);text-transform:uppercase}.titlebar{display:none;text-align:center;padding:14px 18px;border-bottom:1px solid rgba(212,170,88,.25);background:rgba(33,16,8,.97);font-size:21px;text-transform:uppercase;position:sticky;top:0;z-index:20}.screen{padding:22px 18px calc(36px + env(safe-area-inset-bottom))}.intro{text-align:center;padding:4px 2px 18px}.intro h1{margin:0;font-size:28px;line-height:1.12;text-transform:uppercase}.intro p{margin:8px auto 0;color:#cfbda7;font-size:16px;line-height:1.45;max-width:390px}.list{display:grid;gap:16px}.card{width:100%;border:2px solid var(--gold);background:linear-gradient(180deg,var(--cream),#eee4ce);color:var(--ink);border-radius:24px;text-align:left;box-shadow:var(--shadow);cursor:pointer}.stage{padding:20px}.top{display:flex;gap:14px;align-items:flex-start}.num{width:46px;height:46px;border-radius:15px;background:var(--brown);border:1px solid var(--gold);display:grid;place-items:center;color:var(--gold);font-size:24px;flex:none}.kicker{font-size:15px;letter-spacing:.08em;color:var(--gold2);text-transform:uppercase}.stitle{font-size:28px;line-height:1.06;text-transform:uppercase}.desc{font-size:16px;line-height:1.42;color:var(--muted);margin-top:7px}.foot{display:flex;justify-content:space-between;align-items:center;margin-top:16px;padding-top:12px;border-top:1px solid rgba(168,124,50,.3);font-size:14px;color:var(--muted);text-transform:uppercase}.arrow{font-size:29px;color:var(--gold2)}.head{padding:2px 2px 18px}.eyebrow{font-size:15px;letter-spacing:.1em;color:var(--gold);text-transform:uppercase;margin-bottom:6px}.head h2{font-size:34px;line-height:1.02;margin:0;text-transform:uppercase}.head p{margin:8px 0 0;color:#cfbda7;font-size:16px;line-height:1.45}.topic{display:flex;gap:14px;align-items:center;padding:16px}.tidx{width:42px;height:42px;border-radius:13px;background:var(--brown);display:grid;place-items:center;color:var(--gold);font-size:20px;flex:none}.tcopy{flex:1}.ttitle{display:block;font-size:20px;line-height:1.18;text-transform:uppercase}.tnote{display:block;font-size:15px;color:var(--muted);margin-top:4px;line-height:1.35}.lesson{padding:21px}.badge{display:inline-flex;border:1px solid var(--gold2);background:rgba(212,170,88,.15);color:var(--gold2);border-radius:999px;padding:7px 11px;font-size:14px;letter-spacing:.06em;text-transform:uppercase;margin-bottom:15px}.lesson h2{font-size:34px;line-height:1.05;margin:0 0 12px;text-transform:uppercase}.lesson>p{color:var(--muted);font-size:17px;line-height:1.5;margin:0 0 17px}.blocks{display:grid;gap:12px}.block{padding:15px 16px;border-radius:17px;background:var(--cream2);border:1px solid rgba(168,124,50,.3)}.block h3{margin:0 0 7px;font-size:21px;color:var(--green2);text-transform:uppercase}.block p{margin:0;color:var(--muted);font-size:16px;line-height:1.5}@media(max-width:380px){.name{font-size:21px}.sub{font-size:13px}.stitle{font-size:25px}.intro h1{font-size:24px}}@media(min-width:700px){body{background:#120904}.app{box-shadow:0 0 70px rgba(0,0,0,.55)}}
</style>

<body>
<div class="app"><header class="brand" id="brand"><div class="brandin"><svg class="logo" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg"><circle cx="20" cy="20" r="18" stroke="#d4aa58" stroke-width="2"/><circle cx="20" cy="20" r="13.2" stroke="#d4aa58" stroke-width="1" stroke-dasharray="2.2 3.4"/><path d="M20 9.5c-4.3 5.3-9.4 8.4-9.4 13.1A5.9 5.9 0 0020 26.3a5.9 5.9 0 009.4-3.7c0-4.7-5.1-7.8-9.4-13.1z" fill="#f8f0df"/><rect x="18.4" y="24.3" width="3.2" height="6.4" rx="1.2" fill="#f8f0df"/></svg><div><div class="name">STACKUP HOLD'EM<br>ACADEMY</div><div class="sub">CURSO INTERATIVO DE POKER</div></div></div></header><div class="titlebar" id="titlebar"></div><main id="root"></main></div>
<script>
const DATA={
fundamentos:{etapa:'ETAPA 1',title:'FUNDAMENTOS',desc:'Aprenda primeiro como o poker funciona: mãos, mesa, apostas, regras e comportamento.',items:[['Ranking de mãos','Da mão mais forte à mais fraca.'],['Posições na mesa','BTN, blinds, posições iniciais, médias e finais.'],['Small Blind, Big Blind e Ante','Apostas obrigatórias e formação inicial do pote.'],['Streets','Pré-flop, flop, turn e river.'],['Sequência de apostas','Quem age primeiro, ordem das ações e fechamento da rodada.'],['Embaralhando as cartas','Preparação do baralho, corte e distribuição.'],['Misdeal','Quando uma distribuição é inválida e como proceder.'],['Funções do staff','Dealer, floor, direção e responsabilidades na mesa.'],['Terminologias básicas','Vocabulário essencial para entender mesa, ação e estratégia.'],['Perfis de jogadores','Tight, loose, agressivo, passivo e combinações comuns.'],['Cash game e tipos','Estrutura, blinds, buy-in, mesas e formatos de cash.'],['Torneio e tipos','Estruturas, fases, stacks, blinds e formatos de torneio.'],['Bons modos','Etiqueta, ritmo de jogo e respeito às regras da mesa.'],['Outras regras básicas','Showdown, muck, ação verbal, fichas e situações comuns.']]},
modalidades:{etapa:'ETAPA 2',title:'MODALIDADES',desc:'Depois da base, aprenda como as regras mudam entre as principais modalidades.',items:[["Texas Hold'em",'2 cartas na mão e 5 comunitárias.'],['Poker de 5 cartas','5-Card Draw e lógica de troca de cartas.'],['PLO 4 / PLO 5 / PLO 6','Omaha com quatro, cinco ou seis cartas fechadas.'],['5 & 7 Card Stud','Jogos Stud com cartas próprias abertas e fechadas.'],['Razz','Stud lowball: vence a melhor mão baixa.'],['H.O.R.S.E.','Rotação de Hold’em, Omaha Hi/Lo, Razz, Stud e Stud Hi/Lo.'],['Poker Caribenho','Modalidade de cassino jogada contra a casa.'],['Outras modalidades','Outras variantes para ampliar o repertório.']]},
pratica:{etapa:'ETAPA 3',title:'PRÁTICA',desc:'Fixe o aprendizado tomando decisões, resolvendo perguntas e treinando matemática.',items:[['Simulador','Treine mãos e regras das principais modalidades.'],['Quiz','Teste leitura de mãos, vencedores e conceitos.'],['Matemática do poker simplificada','Outs, probabilidades e cálculos essenciais.']]}}
const NOTES={
'Ranking de mãos':[['ORDEM PADRÃO','Royal Flush, Straight Flush, Quadra, Full House, Flush, Sequência, Trinca, Dois Pares, Um Par e Carta Alta.'],['COMO COMPARAR','Primeiro compare a categoria da mão. Em empate, compare as cartas da combinação e depois os kickers.']],
'Posições na mesa':[['POSIÇÕES','SB, BB, UTG, posições médias, HJ, CO e BTN.'],['PRINCÍPIO','Quanto mais tarde você age, mais informação possui sobre as decisões dos adversários.']],
'Small Blind, Big Blind e Ante':[['BLINDS','Small Blind e Big Blind são apostas obrigatórias que giram a cada mão.'],['ANTE','Quando existe, adiciona fichas ao pote antes da ação e é comum em torneios.']],
'Streets':[['SEQUÊNCIA','Pré-flop → Flop → Turn → River → Showdown, quando necessário.'],['BOARD','No Hold’em e Omaha, flop traz 3 cartas, turn 1 e river 1.']],
'Sequência de apostas':[['AÇÕES','Check, bet, call, raise e fold.'],['FECHAMENTO','A rodada termina quando não há ação pendente entre os jogadores que continuam na mão.']],
'Embaralhando as cartas':[['OBJETIVO','Randomizar o baralho e impedir qualquer previsibilidade.'],['FLUXO','Embaralhar, cortar quando aplicável e distribuir conforme a modalidade.']],
'Misdeal':[['DEFINIÇÃO','É uma distribuição inválida que precisa ser corrigida conforme a regra da casa ou do torneio.'],['DECISÃO','Em ambiente organizado, dealer e floor aplicam o procedimento correto.']],
'Funções do staff':[['DEALER','Distribui cartas, controla o pote e conduz a ação.'],['FLOOR','Resolve dúvidas, interpreta regras e decide em situações irregulares.']],
'Terminologias básicas':[['AÇÃO','Check, bet, call, raise, fold, all-in, limp e 3-bet.'],['MESA','Pot, stack, board, showdown, muck, dealer button e blinds.']],
'Perfis de jogadores':[['EIXOS','Tight × loose e agressivo × passivo.'],['USO','Perfis descrevem tendências. Observe frequências antes de classificar alguém.']],
'Cash game e tipos':[['ESTRUTURA','Fichas representam dinheiro; blinds costumam ser estáveis e há regras de buy-in.'],['FORMATOS','Full ring, 6-max, heads-up e diferentes limites de aposta.']],
'Torneio e tipos':[['ESTRUTURA','Blinds aumentam, jogadores podem ser eliminados e a premiação depende da colocação.'],['FORMATOS','MTT, Sit & Go, turbo, bounty, freezeout, re-entry e outros.']],
'Bons modos':[['ETIQUETA','Aja na sua vez, proteja suas cartas e mantenha fichas visíveis.'],['CONVIVÊNCIA','Respeite dealer e jogadores e não revele informação de mão ativa.']],
'Outras regras básicas':[['SHOWDOWN','Mostre as cartas quando necessário para disputar o pote e respeite as regras de muck.'],['AÇÃO VERBAL','Declarações claras como call, raise e all-in podem ser vinculantes.']],
"Texas Hold'em":[['REGRAS','Cada jogador recebe 2 cartas próprias e há 5 cartas comunitárias.'],['MÃO FINAL','A melhor combinação de 5 cartas pode usar qualquer combinação entre mão e board.']],
'Poker de 5 cartas':[['FLUXO','Distribuição → apostas → troca → nova rodada → showdown.'],['CARACTERÍSTICA','Não há board comunitário; cada jogador trabalha com suas próprias 5 cartas.']],
'PLO 4 / PLO 5 / PLO 6':[['REGRA 2 + 3','Use exatamente 2 cartas da mão e exatamente 3 cartas do board.'],['VARIAÇÕES','PLO4, PLO5 e PLO6 mudam a quantidade de cartas próprias recebidas.']],
'5 & 7 Card Stud':[['ESTRUTURA','Não usa board comunitário como Hold’em; cada jogador recebe cartas próprias abertas e fechadas.'],['AÇÃO','A ordem de aposta pode depender das cartas expostas.']],
'Razz':[['OBJETIVO','Formar a melhor mão baixa possível.'],['PONTO-CHAVE','Sequências e flushes normalmente não prejudicam a mão baixa.']],
'H.O.R.S.E.':[['ROTAÇÃO','Hold’em, Omaha Hi/Lo, Razz, Seven Card Stud e Stud Eight-or-Better.'],['COMPETÊNCIA','Exige adaptação rápida entre regras e estruturas diferentes.']],
'Poker Caribenho':[['ESTRUTURA','O jogador enfrenta a casa, não os demais jogadores.'],['PAGAMENTO','Qualificação da casa e pagamentos seguem a tabela do cassino.']],
'Outras modalidades':[['EXEMPLOS','Badugi, 2-7 Triple Draw, Omaha Hi/Lo, Short Deck e mixed games.'],['MÉTODO','Aprenda ranking, distribuição, ordem de apostas e regra de construção da mão.']],
'Simulador':[['NOVO FRONT','O simulador será integrado diretamente nesta interface.'],['SEM LEGADO','Nenhuma tela ou iframe do aplicativo antigo é aberto.']],
'Quiz':[['FORMATO','Pergunta → resposta → correção imediata → explicação curta.'],['OBJETIVO','Fixar mãos, posições, regras e decisões.']],
'Matemática do poker simplificada':[['BASE','Outs, odds, pot odds, equity necessária e relação entre aposta e pote.'],['MÉTODO','Entenda primeiro a lógica e depois automatize com exercícios curtos.']]}
const root=document.getElementById('root'),bar=document.getElementById('titlebar'),order=['fundamentos','modalidades','pratica'];
const esc=s=>String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function setBar(t=''){bar.textContent=t;bar.style.display=t?'block':'none'}
function push(s){history.pushState(s,'','#'+s.type+(s.stage?'-'+s.stage:''))}
function home(){setBar();root.innerHTML=`<section class="screen"><div class="intro"><h1>APRENDA POKER EM 3 ETAPAS</h1><p>Fundamentos, modalidades e prática — em uma ordem lógica de aprendizado.</p></div><div class="list">${order.map((k,i)=>{const s=DATA[k];return `<button class="card stage" onclick="stage('${k}',true)"><div class="top"><span class="num">${i+1}</span><span><span class="kicker">${s.etapa}</span><span class="stitle">${s.title}</span><span class="desc">${s.desc}</span></span></div><div class="foot"><span>${s.items.length} conteúdos</span><span class="arrow">›</span></div></button>`}).join('')}</div></section>`}
function stage(k,p=false){const s=DATA[k];setBar(s.title);root.innerHTML=`<section class="screen"><div class="head"><div class="eyebrow">${s.etapa}</div><h2>${s.title}</h2><p>${s.desc}</p></div><div class="list">${s.items.map((it,i)=>`<button class="card topic" onclick="lesson('${k}',${i},true)"><span class="tidx">${String(i+1).padStart(2,'0')}</span><span class="tcopy"><span class="ttitle">${esc(it[0])}</span><span class="tnote">${esc(it[1])}</span></span><span class="arrow">›</span></button>`).join('')}</div></section>`;if(p)push({type:'stage',stage:k})}
function lesson(k,i,p=false){const s=DATA[k],it=s.items[i],blocks=NOTES[it[0]]||[['CONTEÚDO','Este conteúdo será desenvolvido diretamente dentro do novo Academy.']];setBar(it[0]);root.innerHTML=`<section class="screen"><div class="card lesson"><span class="badge">${s.etapa} · ${i+1}</span><h2>${esc(it[0])}</h2><p>${esc(it[1])}</p><div class="blocks">${blocks.map(b=>`<div class="block"><h3>${esc(b[0])}</h3><p>${esc(b[1])}</p></div>`).join('')}</div></div></section>`;if(p)push({type:'lesson',stage:k,index:i})}
function restore(s){if(!s||s.type==='home')return home();if(s.type==='stage')return stage(s.stage);if(s.type==='lesson')return lesson(s.stage,s.index);home()}
window.onpopstate=e=>restore(e.state);document.getElementById('brand').onclick=()=>{history.pushState({type:'home'},'',location.pathname);home()};history.replaceState({type:'home'},'',location.pathname+location.search);home();if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js?v=6').catch(()=>{}));
</script>
</body>
</html>
