<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0e4b3b">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>StackUp Hold'em Academy</title>
<link rel="manifest" href="./manifest.webmanifest">
<style>
@import url('https://fonts.googleapis.com/css2?family=Love+Ya+Like+A+Sister&display=swap');
:root{
  --green:#0e4b3b;
  --green-deep:#08372d;
  --green-soft:#195f4c;
  --brown:#211008;
  --brown-2:#2a160d;
  --cream:#f2ead8;
  --cream-2:#e7dcc2;
  --ink:#25170f;
  --muted:#725f4d;
  --gold:#d4aa58;
  --gold-deep:#a87c32;
  --white:#f8f0df;
  --radius:24px;
  --shadow:0 14px 34px rgba(0,0,0,.24);
  font-family:'Love Ya Like A Sister',cursive;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:var(--brown);color:var(--white)}
body{overscroll-behavior-y:none}
button{font:inherit}
.app-shell{min-height:100dvh;max-width:560px;margin:0 auto;background:var(--brown);position:relative;overflow-x:hidden}
.brand-header{
  background:linear-gradient(180deg,var(--green-soft) 0%,var(--green) 56%,var(--green-deep) 100%);
  border-bottom:4px solid var(--gold);
  padding:calc(18px + env(safe-area-inset-top)) 22px 17px;
  box-shadow:0 8px 24px rgba(0,0,0,.22);
}
.brand-inner{display:flex;align-items:center;gap:15px;max-width:480px;margin:0 auto}
.brand-mark{width:56px;height:56px;flex:none}
.brand-copy{min-width:0}
.brand-name{font-size:25px;line-height:1.02;letter-spacing:.045em;color:var(--white);text-transform:uppercase}
.brand-sub{margin-top:5px;font-size:15px;line-height:1.1;letter-spacing:.12em;color:var(--gold);text-transform:uppercase}
.nav-bar{
  position:sticky;top:0;z-index:50;display:flex;align-items:center;gap:10px;
  min-height:58px;padding:8px 14px;background:rgba(33,16,8,.96);backdrop-filter:blur(12px);
  border-bottom:1px solid rgba(212,170,88,.25)
}
.nav-bar.home{display:none}
.icon-btn{width:42px;height:42px;border:1px solid rgba(212,170,88,.45);border-radius:14px;background:var(--brown-2);color:var(--gold);display:grid;place-items:center;cursor:pointer;font-size:27px;line-height:1}
.nav-title{flex:1;min-width:0;text-align:center;color:var(--white);font-size:19px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-transform:uppercase}
.screen{padding:22px 18px calc(34px + env(safe-area-inset-bottom))}
.home-intro{padding:4px 2px 18px;text-align:center}
.home-intro h1{font-size:28px;line-height:1.12;margin:0;color:var(--white);text-transform:uppercase}
.home-intro p{margin:7px auto 0;max-width:390px;color:#cfbda7;font-size:16px;line-height:1.45}
.stage-list,.topic-list{display:grid;gap:16px}
.stage-card,.topic-card,.sim-card{
  width:100%;border:2px solid var(--gold);background:linear-gradient(180deg,var(--cream) 0%,#eee4ce 100%);
  color:var(--ink);border-radius:var(--radius);text-align:left;cursor:pointer;box-shadow:var(--shadow)
}
.stage-card{padding:20px 20px 17px}
.stage-card:active,.topic-card:active,.sim-card:active{transform:scale(.985)}
.stage-top{display:flex;align-items:flex-start;gap:14px}
.stage-num{width:46px;height:46px;border-radius:15px;background:var(--brown);border:1px solid var(--gold);display:grid;place-items:center;color:var(--gold);font-size:24px;flex:none}
.stage-copy{flex:1;min-width:0}
.stage-kicker{font-size:15px;letter-spacing:.08em;color:var(--gold-deep);text-transform:uppercase;margin-bottom:2px}
.stage-title{font-size:28px;line-height:1.06;text-transform:uppercase}
.stage-desc{font-size:16px;line-height:1.42;color:var(--muted);margin-top:8px}
.stage-foot{display:flex;justify-content:space-between;align-items:center;margin-top:16px;padding-top:12px;border-top:1px solid rgba(168,124,50,.30)}
.stage-count{font-size:14px;color:var(--muted);text-transform:uppercase}.chev{font-size:30px;color:var(--gold-deep)}
.screen-head{padding:2px 2px 18px}
.eyebrow{font-size:15px;letter-spacing:.1em;color:var(--gold);text-transform:uppercase;margin-bottom:6px}
.screen-head h2{font-size:34px;line-height:1.02;margin:0;color:var(--white);text-transform:uppercase}
.screen-head p{margin:8px 0 0;color:#cfbda7;font-size:16px;line-height:1.45}
.topic-card{display:flex;gap:14px;align-items:center;padding:16px 16px;border-radius:19px}
.topic-index{width:42px;height:42px;border-radius:13px;background:var(--brown);display:grid;place-items:center;color:var(--gold);font-size:20px;flex:none}
.topic-copy{flex:1;min-width:0}.topic-title{font-size:20px;line-height:1.18;text-transform:uppercase;display:block}.topic-note{font-size:15px;color:var(--muted);margin-top:4px;line-height:1.35;display:block}.topic-arrow{font-size:27px;color:var(--gold-deep)}
.lesson-card{border:2px solid var(--gold);background:var(--cream);color:var(--ink);border-radius:24px;padding:21px;box-shadow:var(--shadow)}
.lesson-number{display:inline-flex;border:1px solid var(--gold-deep);background:rgba(212,170,88,.15);color:var(--gold-deep);border-radius:999px;padding:7px 11px;font-size:14px;letter-spacing:.06em;text-transform:uppercase;margin-bottom:15px}
.lesson-card h2{font-size:34px;line-height:1.05;margin:0 0 12px;text-transform:uppercase}.lesson-card p{color:var(--muted);font-size:17px;line-height:1.5;margin:0 0 17px}
.primary-btn,.secondary-btn{width:100%;min-height:54px;border-radius:16px;font-size:17px;text-transform:uppercase;cursor:pointer}
.primary-btn{background:var(--green);color:var(--white);border:2px solid var(--green-deep)}
.secondary-btn{margin-top:10px;background:var(--brown);color:var(--gold);border:1px solid var(--gold)}
.tip{margin-top:14px;padding:14px 15px;border-radius:16px;background:#e8dcc2;border:1px solid rgba(168,124,50,.32);color:var(--muted);font-size:14px;line-height:1.45}
.sim-grid{display:grid;gap:11px;margin-top:14px}.sim-card{padding:16px;border-radius:17px;display:flex;align-items:center;justify-content:space-between;font-size:18px;text-transform:uppercase}
.lesson-frame-wrap{height:calc(100dvh - 118px - env(safe-area-inset-top));background:var(--cream)}.lesson-frame{width:100%;height:100%;border:0;background:var(--cream)}
@media(max-width:380px){.brand-name{font-size:21px}.brand-sub{font-size:13px}.stage-title{font-size:25px}.home-intro h1{font-size:24px}}
@media(min-width:700px){body{background:#120904}.app-shell{box-shadow:0 0 70px rgba(0,0,0,.55)}}
</style>
</head>
<body>
<div class="app-shell">
  <header class="brand-header" id="brandHeader">
    <div class="brand-inner">
      <svg class="brand-mark" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <circle cx="20" cy="20" r="18" fill="none" stroke="#d4aa58" stroke-width="2"/>
        <circle cx="20" cy="20" r="13.2" fill="none" stroke="#d4aa58" stroke-width="1" stroke-dasharray="2.2 3.4"/>
        <path d="M20 9.5c-4.3 5.3-9.4 8.4-9.4 13.1A5.9 5.9 0 0020 26.3a5.9 5.9 0 009.4-3.7c0-4.7-5.1-7.8-9.4-13.1z" fill="#f8f0df"/>
        <rect x="18.4" y="24.3" width="3.2" height="6.4" rx="1.2" fill="#f8f0df"/>
      </svg>
      <div class="brand-copy">
        <div class="brand-name">STACKUP HOLD'EM<br>ACADEMY</div>
        <div class="brand-sub">CURSO INTERATIVO DE POKER</div>
      </div>
    </div>
  </header>
  <div class="nav-bar home" id="navBar">
    <button id="backBtn" class="icon-btn" aria-label="Voltar">‹</button>
    <div class="nav-title" id="navTitle">Hold'em Academy</div>
    <button id="homeBtn" class="icon-btn" aria-label="Início">⌂</button>
  </div>
  <main id="root"></main>
</div>
<script>
const DATA={
fundamentos:{etapa:"ETAPA 1",title:"FUNDAMENTOS",desc:"Aprenda primeiro como o poker funciona: mãos, mesa, apostas, regras e comportamento.",items:[
["Ranking de mãos","Da mão mais forte à mais fraca.","fundamentos"],
["Posições na mesa","BTN, blinds, posições iniciais, médias e finais.","fundamentos"],
["Small Blind, Big Blind e Ante","Apostas obrigatórias e formação inicial do pote.","fundamentos"],
["Streets","Pré-flop, flop, turn e river.","fundamentos"],
["Sequência de apostas","Quem age primeiro, ordem das ações e fechamento da rodada.","fundamentos"],
["Embaralhando as cartas","Preparação do baralho, corte e distribuição.","fundamentos"],
["Misdeal","Quando uma distribuição é inválida e como proceder.","fundamentos"],
["Funções do staff","Dealer, floor, direção e responsabilidades na mesa.","fundamentos"],
["Terminologias básicas","Vocabulário essencial para entender mesa, ação e estratégia.","fundamentos"],
["Perfis de jogadores","Tight, loose, agressivo, passivo e combinações comuns.","fundamentos"],
["Cash game e tipos","Estrutura, blinds, buy-in, mesas e formatos de cash.","fundamentos"],
["Torneio e tipos","Estruturas, fases, stacks, blinds e formatos de torneio.","fundamentos"],
["Bons modos","Etiqueta, ritmo de jogo e respeito às regras da mesa.","fundamentos"],
["Outras regras básicas","Showdown, muck, ação verbal, fichas e situações comuns.","fundamentos"]]},
modalidades:{etapa:"ETAPA 2",title:"MODALIDADES",desc:"Depois da base, aprenda como as regras mudam entre as principais modalidades.",items:[
["Texas Hold'em","2 cartas na mão e 5 comunitárias.","holdem"],
["Poker de 5 cartas","5-Card Draw e lógica de troca de cartas.","draw"],
["PLO 4 / PLO 5 / PLO 6","Omaha com quatro, cinco ou seis cartas fechadas.","omaha"],
["5 & 7 Card Stud","Jogos Stud com cartas próprias abertas e fechadas.","stud"],
["Razz","Stud lowball: vence a melhor mão baixa.","horse"],
["H.O.R.S.E.","Rotação de Hold'em, Omaha Hi/Lo, Razz, Stud e Stud Hi/Lo.","horse"],
["Poker Caribenho","Modalidade de cassino jogada contra a casa.","caribbean"],
["Outras modalidades","Outras variantes para ampliar o repertório.","outras"]]},
pratica:{etapa:"ETAPA 3",title:"PRÁTICA",desc:"Fixe o aprendizado tomando decisões, resolvendo perguntas e treinando matemática.",items:[
["Simulador","Treine mãos e regras das principais modalidades.","simulador"],
["Quiz","Teste leitura de mãos, vencedores e conceitos.","quiz"],
["Matemática do poker simplificada","Outs, probabilidades e cálculos essenciais.","outs"]]}}
const stageOrder=["fundamentos","modalidades","pratica"],root=document.getElementById("root"),navBar=document.getElementById("navBar"),navTitle=document.getElementById("navTitle"),backBtn=document.getElementById("backBtn"),homeBtn=document.getElementById("homeBtn");
function esc(s){return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
function setNav(title,show=true){navTitle.textContent=title;navBar.classList.toggle("home",!show)}
function push(v){history.pushState(v,"","#"+v.type+(v.stage?"-"+v.stage:""))}
function renderHome(){setNav("",false);root.innerHTML=`<section class="screen"><div class="home-intro"><h1>APRENDA POKER EM 3 ETAPAS</h1><p>Fundamentos, modalidades e prática — em uma ordem lógica de aprendizado.</p></div><div class="stage-list">${stageOrder.map((key,i)=>{const s=DATA[key];return `<button class="stage-card" onclick="openStage('${key}',true)"><div class="stage-top"><div class="stage-num">${i+1}</div><div class="stage-copy"><div class="stage-kicker">${s.etapa}</div><div class="stage-title">${s.title}</div><div class="stage-desc">${s.desc}</div></div></div><div class="stage-foot"><span class="stage-count">${s.items.length} CONTEÚDOS</span><span class="chev">›</span></div></button>`}).join("")}</div></section>`}
function openStage(key,p=false){const s=DATA[key];setNav(s.title,true);root.innerHTML=`<section class="screen"><div class="screen-head"><div class="eyebrow">${s.etapa}</div><h2>${s.title}</h2><p>${s.desc}</p></div><div class="topic-list">${s.items.map((it,i)=>`<button class="topic-card" onclick="openTopic('${key}',${i},true)"><span class="topic-index">${String(i+1).padStart(2,"0")}</span><span class="topic-copy"><span class="topic-title">${esc(it[0])}</span><span class="topic-note">${esc(it[1])}</span></span><span class="topic-arrow">›</span></button>`).join("")}</div></section>`;if(p)push({type:"stage",stage:key})}
function openTopic(stage,index,p=false){const s=DATA[stage],it=s.items[index],legacy=it[2];setNav(it[0],true);if(legacy==="simulador"){root.innerHTML=`<section class="screen"><div class="lesson-card"><span class="lesson-number">${s.etapa} · ${index+1}</span><h2>${esc(it[0])}</h2><p>Escolha a modalidade que deseja praticar.</p><div class="sim-grid">${[["Texas Hold'em","holdem"],["PLO 4 / 5 / 6","omaha"],["Seven Card Stud","stud"],["Poker de 5 cartas","draw"],["Poker Caribenho","caribbean"]].map(x=>`<button class="sim-card" onclick="openLesson('${x[1]}','${esc(x[0])}',true)">${esc(x[0])}<span>›</span></button>`).join("")}</div></div></section>`}else{const detail=stage==="fundamentos"?"Este conteúdo faz parte da base universal do poker e deve ser dominado antes das modalidades.":stage==="modalidades"?"Estude regras, distribuição, ordem de ação, formação da mão e diferenças desta modalidade.":"Use esta etapa para transformar conhecimento em decisão prática.";root.innerHTML=`<section class="screen"><div class="lesson-card"><span class="lesson-number">${s.etapa} · ${index+1}</span><h2>${esc(it[0])}</h2><p>${esc(it[1])}</p><p>${detail}</p><button class="primary-btn" onclick="openLesson('${legacy}','${esc(it[0])}',true)">ABRIR CONTEÚDO</button></div></section>`}if(p)push({type:"topic",stage,index})}
function openLesson(id,title,p=false){setNav(title,true);root.innerHTML=`<div class="lesson-frame-wrap"><iframe id="lessonFrame" class="lesson-frame" title="${esc(title)}" src="./legacy.html#${encodeURIComponent(id)}"></iframe></div>`;const frame=document.getElementById("lessonFrame");frame.addEventListener("load",()=>{try{const d=frame.contentDocument;[".rail",".masthead",".ref-toggle",".rail-foot"].forEach(sel=>d.querySelectorAll(sel).forEach(el=>el.style.display="none"));const app=d.querySelector(".app");if(app){app.style.display="block";app.style.gridTemplateColumns="1fr"}const hero=d.getElementById("hero");if(hero)hero.style.display="none";d.querySelectorAll(".chapter").forEach(c=>{c.style.maxWidth="none";c.style.padding="18px 16px 80px"});d.body.style.margin="0"}catch(e){}});if(p)push({type:"lesson",lesson:id,title})}
function restore(v){if(!v||v.type==="home")return renderHome();if(v.type==="stage")return openStage(v.stage,false);if(v.type==="topic")return openTopic(v.stage,v.index,false);if(v.type==="lesson")return openLesson(v.lesson,v.title||"Aula",false);renderHome()}
backBtn.onclick=()=>history.back();homeBtn.onclick=()=>{history.pushState({type:"home"},"",location.pathname);renderHome()};window.onpopstate=e=>restore(e.state);history.replaceState({type:"home"},"",location.pathname+location.search);renderHome();if("serviceWorker" in navigator){window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js?v=4").catch(()=>{}))}
</script>
</body>
</html>
