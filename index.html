<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0b1511">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>StackUp Hold'em Academy</title>
<link rel="manifest" href="./manifest.webmanifest">
<style>
:root{--bg:#08110e;--surface:#101b17;--surface2:#16241e;--surface3:#1b2d25;--line:#274137;--text:#f4f3ec;--muted:#a4b0aa;--green:#57d49b;--green2:#1d9b67;--gold:#d9b66b;--radius:22px;font-family:Roboto,system-ui,-apple-system,"Segoe UI",sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text)}body{overscroll-behavior-y:none}button{font:inherit}
.app-shell{min-height:100dvh;max-width:560px;margin:0 auto;background:var(--bg)}
.app-bar{position:sticky;top:0;z-index:50;display:flex;align-items:center;gap:12px;padding:calc(10px + env(safe-area-inset-top)) 16px 12px;background:rgba(8,17,14,.95);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.icon-btn{width:42px;height:42px;border:1px solid var(--line);border-radius:14px;background:var(--surface);color:var(--text);display:grid;place-items:center;cursor:pointer;font-size:20px}.hidden{visibility:hidden;pointer-events:none}
.brand{min-width:0;flex:1}.brand-kicker{font-size:10px;letter-spacing:.18em;color:var(--green);font-weight:800;text-transform:uppercase}.brand-title{font-size:15px;font-weight:900;letter-spacing:.04em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.screen{padding:22px 16px calc(34px + env(safe-area-inset-bottom))}.hero{padding:8px 2px 22px}.hero-mark{width:58px;height:58px;border-radius:18px;background:linear-gradient(145deg,var(--green2),#0a5c40);display:grid;place-items:center;font-size:29px;font-weight:1000;margin-bottom:18px}.hero h1{font-size:31px;line-height:1.03;letter-spacing:-.035em;margin:0 0 9px;max-width:390px}.hero p{margin:0;color:var(--muted);font-size:15px;line-height:1.5}.section-label{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);font-weight:800;margin:8px 2px 12px}
.stage-list,.topic-list,.sim-grid{display:grid;gap:12px}.stage-card,.topic-card,.sim-card{width:100%;border:1px solid var(--line);background:linear-gradient(145deg,var(--surface2),var(--surface));color:var(--text);border-radius:var(--radius);padding:18px;text-align:left;cursor:pointer}.stage-card:active,.topic-card:active,.sim-card:active{transform:scale(.985)}
.stage-top{display:flex;align-items:flex-start;gap:14px}.stage-num{width:44px;height:44px;border-radius:15px;background:rgba(87,212,155,.11);border:1px solid rgba(87,212,155,.30);display:grid;place-items:center;color:var(--green);font-weight:1000;font-size:18px;flex:none}.stage-copy{flex:1;min-width:0}.stage-kicker{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--green);font-weight:900;margin-bottom:4px}.stage-title{font-size:21px;font-weight:950;text-transform:uppercase}.stage-desc{font-size:13px;line-height:1.45;color:var(--muted);margin-top:6px}.stage-foot{display:flex;justify-content:space-between;align-items:center;margin-top:16px;padding-top:13px;border-top:1px solid var(--line)}.stage-count{font-size:12px;color:var(--muted);font-weight:700}.chev{font-size:21px;color:var(--green)}
.screen-head{padding:4px 2px 20px}.eyebrow{font-size:11px;letter-spacing:.15em;text-transform:uppercase;color:var(--green);font-weight:900;margin-bottom:7px}.screen-head h2{font-size:27px;line-height:1.05;margin:0 0 8px}.screen-head p{margin:0;color:var(--muted);font-size:14px;line-height:1.5}
.topic-card{display:flex;gap:14px;align-items:center;padding:15px 16px;border-radius:18px;background:var(--surface)}.topic-index{width:38px;height:38px;border-radius:12px;background:var(--surface3);display:grid;place-items:center;color:var(--gold);font-weight:900;flex:none}.topic-copy{flex:1;min-width:0}.topic-title{font-size:15px;font-weight:850;text-transform:uppercase;line-height:1.25;display:block}.topic-note{font-size:12px;color:var(--muted);margin-top:3px;display:block}.topic-arrow{font-size:20px;color:var(--muted)}
.lesson-card{border:1px solid var(--line);background:var(--surface);border-radius:24px;padding:20px}.lesson-number{display:inline-flex;border:1px solid rgba(87,212,155,.32);background:rgba(87,212,155,.10);color:var(--green);border-radius:999px;padding:6px 10px;font-size:11px;font-weight:900;letter-spacing:.08em;text-transform:uppercase;margin-bottom:16px}.lesson-card h2{font-size:28px;line-height:1.08;margin:0 0 12px}.lesson-card p{color:var(--muted);font-size:15px;line-height:1.6;margin:0 0 18px}
.primary-btn{width:100%;min-height:52px;border-radius:16px;border:0;font-weight:900;text-transform:uppercase;letter-spacing:.035em;cursor:pointer;background:var(--green);color:#062217}.tip{margin-top:14px;padding:14px 15px;border-radius:16px;background:rgba(217,182,107,.08);border:1px solid rgba(217,182,107,.22);color:#d8c89f;font-size:12px;line-height:1.5}.sim-grid{margin-top:14px}.sim-card{padding:15px 16px;border-radius:17px;background:var(--surface);display:flex;align-items:center;justify-content:space-between;font-weight:850;text-transform:uppercase}.lesson-frame-wrap{height:calc(100dvh - 66px - env(safe-area-inset-top));background:var(--surface)}.lesson-frame{width:100%;height:100%;border:0;background:#fff}
@media(min-width:700px){body{background:#030806}.app-shell{box-shadow:0 0 70px rgba(0,0,0,.55)}}
</style>
</head>
<body>
<div class="app-shell"><header class="app-bar"><button id="backBtn" class="icon-btn hidden" aria-label="Voltar">‹</button><div class="brand"><div class="brand-kicker" id="barKicker">StackUp</div><div class="brand-title" id="barTitle">Hold'em Academy</div></div><button id="homeBtn" class="icon-btn hidden" aria-label="Início">⌂</button></header><main id="root"></main></div>
<script>
const DATA={
fundamentos:{etapa:"ETAPA 1",title:"FUNDAMENTOS",desc:"Aprenda primeiro como o poker funciona: mãos, mesa, apostas, regras e comportamento.",items:[
["Ranking de mãos","Da mão mais forte à mais fraca.","fundamentos"],
["Posições na mesa","BTN, blinds, posições iniciais, médias e finais.","fundamentos"],
["Small Blind, Big Blind e Ante","Apostas obrigatórias e formação inicial do pote.","fundamentos"],
["Streets","Pré-flop, flop, turn e river.","fundamentos"],
["Sequência de apostas","Quem age primeiro, ordem das ações e fechamento da rodada.","fundamentos"],
["Embaralhando as cartas","Preparação do baralho, corte e distribuição.","fundamentos"],
["Misdeal","Quando uma distribuição é inválida e como proceder.","fundamentos"],
["Funções do staff","Dealer, floor, direção e responsabilidades na mesa.","fundamentos"],
["Terminologias básicas","Vocabulário essencial para entender mesa, ação e estratégia.","fundamentos"],
["Perfis de jogadores","Tight, loose, agressivo, passivo e combinações comuns.","fundamentos"],
["Cash game e tipos","Estrutura, blinds, buy-in, mesas e formatos de cash.","fundamentos"],
["Torneio e tipos","Estruturas, fases, stacks, blinds e formatos de torneio.","fundamentos"],
["Bons modos","Etiqueta, ritmo de jogo e respeito às regras da mesa.","fundamentos"],
["Outras regras básicas","Showdown, muck, ação verbal, fichas e situações comuns.","fundamentos"]]},
modalidades:{etapa:"ETAPA 2",title:"MODALIDADES",desc:"Depois da base, aprenda como as regras mudam entre as principais modalidades.",items:[
["Texas Hold'em","2 cartas na mão e 5 comunitárias.","holdem"],
["Poker de 5 cartas","5-Card Draw e lógica de troca de cartas.","draw"],
["PLO 4 / PLO 5 / PLO 6","Omaha com quatro, cinco ou seis cartas fechadas.","omaha"],
["5 & 7 Card Stud","Jogos Stud com cartas próprias abertas e fechadas.","stud"],
["Razz","Stud lowball: vence a melhor mão baixa.","horse"],
["H.O.R.S.E.","Rotação de Hold'em, Omaha Hi/Lo, Razz, Stud e Stud Hi/Lo.","horse"],
["Poker Caribenho","Modalidade de cassino jogada contra a casa.","caribbean"],
["Outras modalidades","Outras variantes para ampliar o repertório.","outras"]]},
pratica:{etapa:"ETAPA 3",title:"PRÁTICA",desc:"Fixe o aprendizado tomando decisões, resolvendo perguntas e treinando matemática.",items:[
["Simulador","Treine mãos e regras das principais modalidades.","simulador"],
["Quiz","Teste leitura de mãos, vencedores e conceitos.","quiz"],
["Matemática do poker simplificada","Outs, probabilidades e cálculos essenciais.","outs"]]}}
const stageOrder=["fundamentos","modalidades","pratica"],root=document.getElementById("root"),backBtn=document.getElementById("backBtn"),homeBtn=document.getElementById("homeBtn"),barTitle=document.getElementById("barTitle"),barKicker=document.getElementById("barKicker");
function esc(s){return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
function setBar(k,t,b=true){barKicker.textContent=k;barTitle.textContent=t;backBtn.classList.toggle("hidden",!b);homeBtn.classList.toggle("hidden",!b)}
function push(v){history.pushState(v,"","#"+v.type+(v.stage?"-"+v.stage:""))}
function renderHome(){setBar("StackUp","Hold'em Academy",false);root.innerHTML=`<section class="screen"><div class="hero"><div class="hero-mark">S</div><h1>APRENDA POKER EM UMA ORDEM QUE FAZ SENTIDO.</h1><p>Comece pelos fundamentos, avance pelas modalidades e termine praticando.</p></div><div class="section-label">Trilha de aprendizado</div><div class="stage-list">${stageOrder.map((key,i)=>{const s=DATA[key];return `<button class="stage-card" onclick="openStage('${key}',true)"><div class="stage-top"><div class="stage-num">${i+1}</div><div class="stage-copy"><div class="stage-kicker">${s.etapa}</div><div class="stage-title">${s.title}</div><div class="stage-desc">${s.desc}</div></div></div><div class="stage-foot"><span class="stage-count">${s.items.length} CONTEÚDOS</span><span class="chev">›</span></div></button>`}).join("")}</div></section>`}
function openStage(key,p=false){const s=DATA[key];setBar(s.etapa,s.title,true);root.innerHTML=`<section class="screen"><div class="screen-head"><div class="eyebrow">${s.etapa}</div><h2>${s.title}</h2><p>${s.desc}</p></div><div class="topic-list">${s.items.map((it,i)=>`<button class="topic-card" onclick="openTopic('${key}',${i},true)"><span class="topic-index">${String(i+1).padStart(2,"0")}</span><span class="topic-copy"><span class="topic-title">${esc(it[0])}</span><span class="topic-note">${esc(it[1])}</span></span><span class="topic-arrow">›</span></button>`).join("")}</div></section>`;if(p)push({type:"stage",stage:key})}
function openTopic(stage,index,p=false){const s=DATA[stage],it=s.items[index],legacy=it[2];setBar(s.etapa,it[0],true);if(legacy==="simulador"){root.innerHTML=`<section class="screen"><div class="lesson-card"><span class="lesson-number">${s.etapa} · ${index+1}</span><h2>${esc(it[0])}</h2><p>Escolha a modalidade que deseja praticar.</p><div class="sim-grid">${[["Texas Hold'em","holdem"],["PLO 4 / 5 / 6","omaha"],["Seven Card Stud","stud"],["Poker de 5 cartas","draw"],["Poker Caribenho","caribbean"]].map(x=>`<button class="sim-card" onclick="openLesson('${x[1]}','${esc(x[0])}',true)">${esc(x[0])}<span>›</span></button>`).join("")}</div></div></section>`}else{const detail=stage==="fundamentos"?"Este conteúdo faz parte da base universal do poker e deve ser dominado antes das modalidades.":stage==="modalidades"?"Estude regras, distribuição, ordem de ação, formação da mão e diferenças desta modalidade.":"Use esta etapa para transformar conhecimento em decisão prática.";root.innerHTML=`<section class="screen"><div class="lesson-card"><span class="lesson-number">${s.etapa} · ${index+1}</span><h2>${esc(it[0])}</h2><p>${esc(it[1])}</p><p>${detail}</p><button class="primary-btn" onclick="openLesson('${legacy}','${esc(it[0])}',true)">ABRIR CONTEÚDO</button>${stage==="fundamentos"?`<div class="tip">O conteúdo já existente foi preservado durante a migração. Esta nova navegação agora separa cada assunto em seu próprio card.</div>`:""}</div></section>`}if(p)push({type:"topic",stage,index})}
function openLesson(id,title,p=false){setBar("AULA",title,true);root.innerHTML=`<div class="lesson-frame-wrap"><iframe id="lessonFrame" class="lesson-frame" title="${esc(title)}" src="./legacy.html#${encodeURIComponent(id)}"></iframe></div>`;const f=document.getElementById("lessonFrame");f.addEventListener("load",()=>{try{const d=f.contentDocument,r=d.querySelector(".rail"),m=d.querySelector(".masthead"),a=d.querySelector(".app"),h=d.getElementById("hero");if(r)r.style.display="none";if(m)m.style.display="none";if(a){a.style.display="block";a.style.gridTemplateColumns="1fr"}if(h)h.style.display="none";d.querySelectorAll(".chapter").forEach(c=>{c.style.maxWidth="none";c.style.padding="18px 16px 80px"})}catch(e){}});if(p)push({type:"lesson",lesson:id,title})}
function restore(v){if(!v||v.type==="home")return renderHome();if(v.type==="stage")return openStage(v.stage);if(v.type==="topic")return openTopic(v.stage,v.index);if(v.type==="lesson")return openLesson(v.lesson,v.title||"Aula");renderHome()}
backBtn.onclick=()=>history.back();homeBtn.onclick=()=>{history.pushState({type:"home"},"",location.pathname);renderHome()};window.onpopstate=e=>restore(e.state);history.replaceState({type:"home"},"",location.pathname+location.search);renderHome();if("serviceWorker" in navigator)window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js").catch(()=>{}));
</script>
</body>
</html>
