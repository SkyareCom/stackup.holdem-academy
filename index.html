function renderRanking(stage,index,p=false){
  const s=DATA[stage];setNav("Ranking de mãos",true);
  root.innerHTML=`<section class="screen"><div class="lesson-card"><span class="lesson-number">${s.etapa} · 01</span><h2>RANKING DE MÃOS</h2><p>Da combinação mais forte para a mais fraca. As cartas abaixo mostram um exemplo visual de cada mão.</p><div class="ranking-list">${RANKING.map((r,i)=>`<div class="ranking-row"><div class="ranking-head"><span class="ranking-pos">${String(i+1).padStart(2,"0")}</span><span class="ranking-name">${r[0]}</span></div><div class="poker-hand">${r[1].map(cardHTML).join("")}</div><div class="ranking-note">${r[2]}</div></div>`).join("")}</div></div></section>`;
  if(p)push({type:"topic",stage,index});
}
function openTopic(stage,index,p=false){
  if(stage==="fundamentos" && index===0) return renderRanking(stage,index,p);
  const s=DATA[stage],it=s.items[index],lesson=LESSONS[stage][index];
  setNav(it[0],true);
  const blocks=lesson[2].map(b=>`<div class="lesson-block"><h3>${esc(b[0])}</h3><p>${esc(b[1])}</p></div>`).join("");
  root.innerHTML=`<section class="screen"><div class="lesson-card"><span class="lesson-number">${s.etapa} · ${String(index+1).padStart(2,"0")}</span><h2>${esc(lesson[0])}</h2><p>${esc(lesson[1])}</p><div class="lesson-content">${blocks}</div></div></section>`;
  if(p)push({type:"topic",stage,index});
}
function restore(v){if(!v||v.type==="home")return renderHome();if(v.type==="stage")return openStage(v.stage,false);if(v.type==="topic")return openTopic(v.stage,v.index,false);renderHome()}
window.onpopstate=e=>restore(e.state);
document.getElementById("brandHeader").addEventListener("click",()=>{history.pushState({type:"home"},"",location.pathname);renderHome()});
history.replaceState({type:"home"},"",location.pathname+location.search);renderHome();
if("serviceWorker" in navigator){window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js?v=7").catch(()=>{}))}
</script>
</body>
</html>
